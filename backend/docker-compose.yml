# version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/authdb
      SECRET_KEY: hiep-tran-thanh-mieu
    # ports:
    #   - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  ai-service:
    build: ./ai-service
    # ports:
    #   - "8002:8000"
    depends_on:
      - auth-service
    networks:
      - app-network

  kong:
    image: kong:3.9.1-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8004:8001"
    depends_on:
      - auth-service
      - ai-service
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  data-ingestor:
    build: ./data-ingestor
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8005:8005"
    depends_on:
      - qdrant
    networks:
      - app-network
    volumes:
      - ingestor_uploads:/app/uploads

  study-planner:
    build: ./study-planner-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/authdb
      SECRET_KEY: hiep-tran-thanh-mieu
      INGESTOR_URL: http://data-ingestor:8005
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      data-ingestor:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - app-network

  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "neo4j/testtest"
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - app-network

volumes:
  postgres_data:
  agent_data:
  qdrant_data:
  ingestor_uploads:

networks:
  app-network:
    driver: bridge
