_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8000
    routes:
      - name: auth-route
        paths:
          - /auth
          - /detect
        strip_path: false

  - name: ai-service
    url: http://ai-service:8003
    routes:
      - name: ai-route
        paths:
          - /ai
        strip_path: true

  - name: mcp-server
    url: http://mcp-server:8002
    routes:
      - name: mcp-route
        paths:
          - /mcp
        strip_path: true

  - name: data-ingestor-service
    url: http://data-ingestor:8005
    routes:
      - name: ingestor-route
        paths:
          - /ingest
          - /search
        strip_path: true

  - name: study-planner-service
    url: http://study-planner:8006
    routes:
      - name: planner-route
        paths:
          - /planner
        strip_path: true