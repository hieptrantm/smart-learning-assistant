_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8000
    # url: http://localhost:8001
    routes:
      - name: auth-route
        paths:
          - /auth
          - /detect 
        strip_path: false

  - name: ai-service
    url: http://ai-service:8000
    # url: http://localhost:8000
    routes:
      - name: ai-route
        paths:
          - /ai/upload
        strip_path: false

  - name: agent-service
    url: http://agent-service:8000
    routes:
      - name: agent-route
        paths:
          - /agent
        strip_path: false

  - name: study-planner-service
    url: http://study-planner:8006
    routes:
      - name: planner-route
        paths:
          - /planner
        strip_path: false

  - name: data-ingestor-service
    url: http://data-ingestor:8005
    routes:
      - name: ingestor-route
        paths:
          - /ingest
          - /search
        strip_path: false